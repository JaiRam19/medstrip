spring:
  application:
    name: medstrip-agents
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: vision-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: RECORD

server:
  port: 8082