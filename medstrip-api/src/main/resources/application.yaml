spring:
  application:
    name: medstrip-api

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ---------- Redis server  ----------
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis

app:
  s3:
    endpoint: http://localhost:4566
    region: ap-south-1
    bucket: medstrip-photos
    access-key: test
    secret-key: test
    path-style-access: true
